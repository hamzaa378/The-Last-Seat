name: the-last-seat
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 4s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 4s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: tickets
      RABBITMQ_DEFAULT_PASS: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment: &shared_env
      DATABASE_URL: postgresql://tickets:${DB_PASSWORD}@postgres:5432/tickets
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://tickets:${DB_PASSWORD}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      HOLD_SECONDS: ${HOLD_SECONDS:-120}
      PAYMENT_DELAY_SECONDS: 10
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 8s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "worker.run"]
    environment: *shared_env
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
