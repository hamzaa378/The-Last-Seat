name: backend-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Static syntax and fast unit tests
        run: |
          python -m compileall -q app worker tests scripts
          python -m pytest -q tests/test_unit.py tests/test_cache_disabled.py tests/test_frontend_client.py tests/test_seat_ui.py tests/test_cleanup_guard.py
      - name: Start full local stack
        run: |
          cp .env.example .env
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=100
          exit 1
      - name: Live PostgreSQL concurrency and payment tests
        env:
          RUN_INTEGRATION: '1'
          BASE_URL: http://localhost:8080
          TEST_DATABASE_URL: postgresql://tickets:change_me_local_db_password@localhost:5434/tickets
        run: |
          python -m pytest -q tests/test_integration.py -v
          python scripts/concurrency_probe.py --base http://localhost:8080
      - name: Logs if failing
        if: failure()
        run: docker compose logs --tail=200
      - name: Shut down ephemeral CI containers
        if: always()
        run: docker compose down -v
